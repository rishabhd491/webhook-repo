<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Action Repo - Webhook Viewer</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>GitHub Action History</h1>
            <p>Showing the latest activity for the repository</p>
        </header>
        
        <main id="action-list">
            <!-- Action cards will be injected here -->
        </main>
    </div>

    <script>
        const fetchActions = () => {
            axios.get('/actions')
                .then(response => {
                    const actionList = document.getElementById('action-list');
                    const actions = response.data;
                    
                    if (actions.length === 0) {
                        actionList.innerHTML = '<div class="empty-state">No GitHub actions detected yet. Waiting for incoming webhooks...</div>';
                        return;
                    }

                    actionList.innerHTML = actions.map(action => {
                        let content = '';
                        const date = new Date(action.timestamp);
                        
                        // Custom date formatting to match requirement: "1st April 2021 - 9:30 PM UTC"
                        const day = date.getDate();
                        const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
                        const month = monthNames[date.getMonth()];
                        const year = date.getFullYear();
                        
                        const suffix = (d) => {
                            if (d > 3 && d < 21) return 'th';
                            switch (d % 10) {
                                case 1:  return "st";
                                case 2:  return "nd";
                                case 3:  return "rd";
                                default: return "th";
                            }
                        };
                        
                        const time = date.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true, timeZone: 'UTC' });
                        const formattedDate = `${day}${suffix(day)} ${month} ${year} - ${time} UTC`;
                        
                        if (action.action === 'PUSH') {
                            content = `"${action.author}" pushed to "${action.to_branch}" on ${formattedDate}`;
                        } else if (action.action === 'PULL_REQUEST') {
                            content = `"${action.author}" submitted a pull request from "${action.from_branch}" to "${action.to_branch}" on ${formattedDate}`;
                        } else if (action.action === 'MERGE') {
                            content = `"${action.author}" merged branch "${action.from_branch}" to "${action.to_branch}" on ${formattedDate}`;
                        }

                        return `
                            <div class="action-card ${action.action.toLowerCase()}">
                                <div class="action-info">
                                    <span class="action-type">${action.action.replace('_', ' ')}</span>
                                    <p class="action-content">${content}</p>
                                </div>
                            </div>
                        `;
                    }).join('');
                })
                .catch(error => {
                    console.error('Error fetching actions:', error);
                });
        };

        // Initial fetch
        fetchActions();
        
        // Poll every 15 seconds
        setInterval(fetchActions, 15000);
    </script>
</body>
</html>
